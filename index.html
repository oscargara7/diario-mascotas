<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Mascotas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f6fa; color: #2f3640; display: flex; justify-content: center; min-height: 100vh; }
        .app { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; padding: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.08); padding-bottom: 40px; }
        header { background: linear-gradient(135deg, #718093 0%, #2f3640 100%); color: white; padding: 20px 15px; border-radius: 14px; text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 20px; }
        header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }
        h2 { font-size: 15px; margin: 18px 0 10px; color: #353b48; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #f1f2f6; padding: 12px; border-radius: 10px; text-align: center; font-weight: 600; font-size: 14px; border: 1px solid #e1e2e6; }
        .box { background: #e1b12c12; border: 2px dashed #e1b12c; padding: 15px; border-radius: 12px; margin-top: 25px; }
        .box h3 { font-size: 14px; color: #2f3640; margin-bottom: 8px; }
        input, select, button { width: 100%; padding: 11px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
        button { background: #44bd32; color: white; border: none; font-weight: bold; cursor: pointer; }
        .memory { background: #fff; border: 1px solid #e1e2e6; padding: 12px; border-radius: 10px; margin-top: 10px; }
        .tag { font-size: 11px; font-weight: bold; background: #718093; color: white; padding: 3px 8px; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>🐾 Diario de Mascotas</h1>
        <p>Los 11 consentidos del clan</p>
    </header>

    <h2>🐶 Los Perris (3)</h2>
    <div class="grid">
        <div class="card">🐶 Perri</div>
        <div class="card">🐶 Malita</div>
        <div class="card">🐶 Mala</div>
    </div>

    <h2>🐱 Los Michis (8)</h2>
    <div class="grid">
        <div class="card">🐱 Mboka</div>
        <div class="card">🐱 Grisita</div>
        <div class="card">🐱 Fortuna</div>
        <div class="card">🐱 Bigote</div>
        <div class="card">🐱 Chicho</div>
        <div class="card">🐱 Negro</div>
        <div class="card">🐱 Olimpito</div>
        <div class="card">🐱 Grisita 2</div>
    </div>

    <div class="box">
        <h3>📝 Agregar Anécdota o Recuerdo</h3>
        <select id="mascotaSelect">
            <optgroup label="Perros">
                <option value="🐶 Perri">Perri</option>
                <option value="🐶 Malita">Malita</option>
                <option value="🐶 Mala">Mala</option>
            </optgroup>
            <optgroup label="Gatos">
                <option value="🐱 Mboka">Mboka</option>
                <option value="🐱 Grisita">Grisita</option>
                <option value="🐱 Fortuna">Fortuna</option>
                <option value="🐱 Bigote">Bigote</option>
                <option value="🐱 Chicho">Chicho</option>
                <option value="🐱 Negro">Negro</option>
                <option value="🐱 Olimpito">Olimpito</option>
                <option value="🐱 Grisita 2">Grisita 2</option>
            </optgroup>
        </select>
        <input type="text" id="notaInput" placeholder="Escribe una nota sobre la mascota...">
        <button onclick="guardarRecuerdo()">Guardar Recuerdo ✨</button>
    </div>

    <h2>📖 Muro de Recuerdos</h2>
    <div id="muroRecuerdos">
        <p style="font-size: 12px; color: #888; margin-top: 10px; text-align: center;" id="sinRecuerdos">Aún no hay recuerdos guardados.</p>
    </div>
</div>

<script>
    function cargarRecuerdos() {
        const recuerdos = JSON.parse(localStorage.getItem('recuerdos_mascotas') || '[]');
        const contenedor = document.getElementById('muroRecuerdos');
        if (recuerdos.length > 0) {
            contenedor.innerHTML = '';
            recuerdos.forEach(r => {
                contenedor.innerHTML += `
                    <div class="memory">
                        <span class="tag">${r.mascota}</span>
                        <p style="margin-top: 6px; font-size: 13px;">${r.nota}</p>
                    </div>
                `;
            });
        }
    }

    function guardarRecuerdo() {
        const mascota = document.getElementById('mascotaSelect').value;
        const nota = document.getElementById('notaInput').value;
        if (!nota.trim()) return alert('Por favor escribe una nota.');

        const recuerdos = JSON.parse(localStorage.getItem('recuerdos_mascotas') || '[]');
        recuerdos.unshift({ mascota, nota });
        localStorage.setItem('recuerdos_mascotas', JSON.stringify(recuerdos));
        
        document.getElementById('notaInput').value = '';
        cargarRecuerdos();
    }

    cargarRecuerdos();
</script>
</body>
</html>
